<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Pago Seguro | OradorIA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.0/css/all.min.css">
</head>

<body class="bg-gradient-to-br from-slate-50 via-blue-50 to-white min-h-screen">

<div class="max-w-6xl mx-auto py-16 px-8">

    <h1 class="text-5xl font-bold text-center text-slate-800">
        Finalizar compra
    </h1>

    <p class="text-center text-slate-500 mt-3">
        Tu información está protegida mediante cifrado SSL.
    </p>

    <div class="grid lg:grid-cols-2 gap-10 mt-14">

        <!-- FORMULARIO -->
        <div class="bg-white rounded-3xl shadow-xl p-10">

            <h2 class="text-2xl font-bold mb-8">
                Información de pago
            </h2>

            <form th:action="@{/procesar-pago}" method="post">

                <input type="hidden" name="plan" th:value="${plan}">

                <!-- TITULAR -->
                <div class="mb-5">
                    <label class="font-semibold">Nombre del titular</label>
                    <input type="text" name="titular" required
                           class="mt-2 w-full border rounded-xl p-4 focus:ring-2 focus:ring-blue-500">
                </div>

                <!-- TARJETA -->
                <div class="mb-5">
                    <label class="font-semibold">Número de tarjeta</label>
                    <input type="text" name="tarjeta" maxlength="19"
                           placeholder="1234 5678 9012 3456"
                           required
                           class="mt-2 w-full border rounded-xl p-4">
                </div>

                <!-- FECHA Y CVV -->
                <div class="grid grid-cols-2 gap-5">

                    <div>
                        <label class="font-semibold">Fecha Exp.</label>
                        <input type="text" name="fecha" placeholder="MM/AA" required
                               class="mt-2 w-full border rounded-xl p-4">
                    </div>

                    <div>
                        <label class="font-semibold">CVV</label>
                        <input type="password" name="cvv" maxlength="3" required
                               class="mt-2 w-full border rounded-xl p-4">
                    </div>

                </div>

                <!-- BOTÓN -->
                <button class="mt-10 w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-xl text-lg font-bold">
                    <i class="fas fa-lock mr-2"></i> Pagar ahora
                </button>

            </form>

        </div>

        <!-- RESUMEN -->
        <div class="bg-white rounded-3xl shadow-xl p-10">

            <h2 class="text-2xl font-bold">Resumen del pedido</h2>

            <div class="mt-8 space-y-5">

                <!-- PLAN -->
                <div class="flex justify-between">
                    <span>Plan</span>
                    <strong th:text="${plan}">Plan</strong>
                </div>

                <!-- PRECIO -->
                <div class="flex justify-between">
                    <span>Precio</span>
                    <strong>
                        <span th:if="${plan == 'profesional'}">$12</span>
                        <span th:if="${plan == 'premium'}">$29</span>
                    </strong>
                </div>

                <!-- RENOVACIÓN -->
                <div class="flex justify-between">
                    <span>Renovación</span>
                    <strong>Mensual</strong>
                </div>

                <hr>

                <!-- TOTAL -->
                <div class="flex justify-between text-2xl">
                    <strong>Total</strong>
                    <strong class="text-blue-600">
                        <span th:if="${plan == 'profesional'}">$12</span>
                        <span th:if="${plan == 'premium'}">$29</span>
                    </strong>
                </div>

            </div>

            <!-- SEGURIDAD -->
            <div class="mt-10 bg-green-50 border border-green-200 p-6 rounded-2xl">

                <div class="flex items-center gap-3">
                    <i class="fas fa-shield-alt text-green-600 text-3xl"></i>

                    <div>
                        <h3 class="font-bold text-green-700">
                            Pago Seguro
                        </h3>
                        <p class="text-sm text-green-600">
                            Transacciones protegidas con SSL
                        </p>
                    </div>
                </div>

            </div>

            <!-- ICONOS -->
            <div class="mt-8 flex justify-center gap-6 text-5xl text-slate-500">
                <i class="fab fa-cc-visa"></i>
                <i class="fab fa-cc-mastercard"></i>
                <i class="fab fa-cc-amex"></i>
            </div>

        </div>

    </div>

</div>

</body>
</html>
