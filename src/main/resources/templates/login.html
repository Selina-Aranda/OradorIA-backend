<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OradorIA · Iniciar sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Inter Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <!-- Tarjeta principal -->
        <div class="bg-white rounded-2xl shadow-sm p-8 border border-slate-200">
            
            <!-- Logo / Título -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
                    <i class="fas fa-microphone-lines text-white text-3xl"></i>
                </div>
                <h1 class="text-3xl font-extrabold text-blue-600 mb-1">OradorIA</h1>
                <p class="text-slate-500 text-sm">Tu asistente inteligente de voz</p>
            </div>

            <!-- Pestañas: Iniciar sesión / Registrarse -->
            <div class="flex gap-2 bg-slate-50 rounded-xl p-1 mb-6 border border-slate-200">
                <button id="loginTab" class="flex-1 py-2.5 rounded-lg font-semibold transition-all duration-200 text-white bg-blue-600">
                    Iniciar sesión
                </button>
                <button id="registerTab" class="flex-1 py-2.5 rounded-lg font-semibold transition-all duration-200 text-slate-600 hover:text-slate-900">
                    Registrarse
                </button>
            </div>

            <!-- Formulario de Inicio de Sesión -->
            <form th:action="@{/login}" method="post" id="loginForm" class="space-y-5" novalidate>
                <input type="hidden"/>
                <div th:if="${error}" class="rounded-xl bg-red-50 border border-red-200 text-red-700 px-4 py-3">
                    <p th:text="${error}"></p>
                </div>
                <div>
                    <label class="block text-slate-700 text-sm font-medium mb-2">
                        <i class="fas fa-envelope mr-2 text-blue-600"></i>Correo electrónico
                    </label>
                    <input type="email" name="email" id="loginEmail" placeholder="tu@email.com"
                           class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300 transition" required>
                </div>
                <div>
                    <label class="block text-slate-700 text-sm font-medium mb-2">
                        <i class="fas fa-lock mr-2 text-blue-600"></i>Contraseña
                    </label>
                    <input type="password" name="password" id="loginPassword" placeholder="********"
                           class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300 transition">
                </div>
                <div class="flex items-center justify-between">
                    <label class="flex items-center text-sm text-slate-600">
                        <input type="checkbox" id="rememberMe" class="mr-2 rounded border-slate-300 bg-white text-blue-600 focus:ring-blue-200">
                        Recordarme
                    </label>
                    <a href="#" class="text-sm text-blue-600 hover:text-blue-700 transition">¿Olvidaste tu contraseña?</a>
                </div>
                <button id="loginBtn" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200 mt-4">
                    Iniciar sesión
                </button>
            </form>

            <!-- Formulario de Registro (oculto inicialmente) -->
            <form th:action="@{/registro}" method="post" id="registerForm" class="space-y-5 hidden" novalidate>
                <input type="hidden"/>
                <!-- Nombres -->

                
                <div>
                    <label class="block text-slate-700 text-sm font-medium mb-2">
                        <i class="fas fa-envelope mr-2 text-blue-600"></i>Correo electrónico
                    </label>
                    <input type="email" name="email" id="regEmail" placeholder="tu@email.com"
                           class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300" required>
                </div>
                <div>
                    <label class="block text-slate-700 text-sm font-medium mb-2">
                        <i class="fas fa-lock mr-2 text-blue-600"></i>Contraseña
                    </label>
                    <input type="password" name="password" id="regPassword" placeholder="********"
                           class="w-full px-4 py-3 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-300" required>
                </div>
                <button id="registerBtn" type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-200 mt-4">
                    Crear cuenta
                </button>
            </form>

            <!-- Divisor -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-slate-200"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-3 bg-white text-slate-500">O continuar con</span>
                </div>
            </div>

            <!-- Botones sociales -->
            <div class="grid grid-cols-2 gap-3">
                <button id="googleBtn" class="flex items-center justify-center gap-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition">
                    <i class="fab fa-google text-red-500"></i> Google
                </button>
                <button id="githubBtn" class="flex items-center justify-center gap-2 bg-white hover:bg-slate-50 border border-slate-200 text-slate-700 font-medium py-2.5 rounded-xl transition">
                    <i class="fab fa-github text-slate-900"></i> GitHub
                </button>
            </div>

            <!-- Mensaje de feedback (toast) -->
            <div id="toastMessage" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 bg-slate-900/90 backdrop-blur-md text-white px-6 py-3 rounded-full text-sm font-medium shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50">
                Mensaje
            </div>
        </div>
        
        <p class="text-center text-slate-400 text-xs mt-6">
            © 2025 OradorIA · Potencia tu voz con IA
        </p>
    </div>

    <script>
        // Elementos del DOM
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const googleBtn = document.getElementById('googleBtn');
        const githubBtn = document.getElementById('githubBtn');
        const toast = document.getElementById('toastMessage');

        // Función para mostrar notificaciones
        function showToast(message, isError = false) {
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'bg-slate-900/90');
            toast.classList.add('opacity-100');
            if (isError) {
                toast.classList.add('bg-red-600/90');
            } else {
                toast.classList.add('bg-green-600/90');
            }
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'bg-red-600/90', 'bg-green-600/90');
                toast.classList.add('opacity-0', 'bg-slate-900/90');
            }, 3000);
        }

        // Cambiar entre tabs
        function setActiveTab(tab) {
            if (tab === 'login') {
                loginTab.classList.add('bg-blue-600', 'text-white');
                loginTab.classList.remove('text-slate-600');

                registerTab.classList.remove('bg-blue-600', 'text-white');
                registerTab.classList.add('text-slate-600');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                registerTab.classList.add('bg-blue-600', 'text-white');
                registerTab.classList.remove('text-slate-600');

                loginTab.classList.remove('bg-blue-600', 'text-white');
                loginTab.classList.add('text-slate-600');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        // Abrir tab según URL: /registro, ?tab=register o #register
        (function initTabFromUrl() {
            const params = new URLSearchParams(window.location.search);
            const tab = params.get('tab');
            const hash = (window.location.hash || '').replace('#', '');
            const path = window.location.pathname.toLowerCase();
            if (tab === 'register' || hash === 'register' || path.endsWith('/registro')) {
                setActiveTab('register');
            } else {
                setActiveTab('login');
            }
        })();

        loginTab.addEventListener('click', () => setActiveTab('login'));
        registerTab.addEventListener('click', () => setActiveTab('register'));

        // Validar email simple
        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        // INICIAR SESIÓN
        loginBtn.addEventListener('click', () => {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!email || !password) {
                showToast('❌ Completa todos los campos', true);
                return;
            }
            if (!isValidEmail(email)) {
                showToast('📧 Correo electrónico inválido', true);
                return;
            }
            if (password.length < 4) {
                showToast('🔒 La contraseña debe tener al menos 4 caracteres', true);
                return;
            }

            // Simular inicio de sesión exitoso
            console.log('Inicio sesión:', { email, password, rememberMe });
            showToast(`✅ ¡Bienvenido de nuevo, ${email.split('@')[0]}!`);
            
            // Aquí podrías redirigir a otro panel o limpiar campos
            // window.location.href = "/dashboard";
        });

        // REGISTRO
        registerBtn.addEventListener('click', () => {
            const name = document.getElementById('regName').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;

            if (!name || !email || !password) {
                showToast('⚠️ Todos los campos son obligatorios', true);
                return;
            }
            if (!isValidEmail(email)) {
                showToast('📧 Correo electrónico inválido', true);
                return;
            }
            if (password.length < 6) {
                showToast('🔒 La contraseña debe tener mínimo 6 caracteres', true);
                return;
            }

            // Simular registro exitoso
            console.log('Registro:', { name, email, password });
            showToast(`🎉 ¡Cuenta creada! Ahora inicia sesión, ${name}`);
            
            // Cambiar automáticamente a login después de 1.5s
            setTimeout(() => {
                setActiveTab('login');
                // Limpiar campos de registro (opcional)
                document.getElementById('regName').value = '';
                document.getElementById('regEmail').value = '';
                document.getElementById('regPassword').value = '';
                // Enfocar email de login
                document.getElementById('loginEmail').focus();
            }, 1700);
        });

        // Botones sociales
        googleBtn.addEventListener('click', () => {
            showToast('🌐 Conectando con Google...');
            // Aquí iría la lógica OAuth real
            setTimeout(() => showToast('🔁 Demo: redirección a Google (simulado)'), 800);
        });

        githubBtn.addEventListener('click', () => {
            showToast('🐙 Conectando con GitHub...');
            setTimeout(() => showToast('🔁 Demo: autenticación GitHub (simulado)'), 800);
        });

        // Permitir "Enter" en los inputs principales
        const loginPassword = document.getElementById('loginPassword');
        loginPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') loginBtn.click();
        });
        const regPassword = document.getElementById('regPassword');
        regPassword.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') registerBtn.click();
        });
    </script>
</body>
</html>
