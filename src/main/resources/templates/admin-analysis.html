<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <title>Análisis | OradorIA Admin</title>

        <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet" />

    <style>
        body {
            background: #f8fafc;
            font-family: Inter, sans-serif;
        }

        .card {
            background: white;
            border-radius: 24px;
            border: 1px solid #e2e8f0;
        }
        .sidebar-link {
        transition: .2s;
        }

        .sidebar-link:hover {
        background: #f8fafc;
        color: #0f172a;
        }

        .sidebar-active {
        background: #eff6ff;
        color: #2563eb;
        font-weight: 600;
        }
    </style>

</head>

<body class="antialiased">

    <div class="min-h-screen flex">

        <!-- SIDEBAR -->
        <aside class="w-[280px] bg-white border-r border-slate-200 hidden md:flex flex-col">

            <!-- LOGO -->
            <div class="px-6 py-6">

                <div class="flex items-center gap-3">

                    <span class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-600">
                        <i class="fas fa-microphone-lines text-white"></i>
                    </span>

                    <span class="text-xl font-extrabold text-blue-600">
                        OradorIA Admin
                    </span>

                </div>

            </div>

            <!-- MENU -->
            <nav class="px-4 space-y-2">

                <!-- DASHBOARD -->
                <a th:href="@{/admin-dashboard}" class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3">

                    <i class="fas fa-chart-pie w-5"></i>

                    <span>Dashboard</span>

                </a>

                <!-- USUARIOS -->
                <a th:href="@{/admin-users}"
                    class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600">

                    <i class="fas fa-users w-5"></i>

                    <span>Usuarios</span>

                </a>

                <!-- ANALISIS -->
                <a th:href="@{/admin-analysis}"
                    class="sidebar-active flex items-center gap-3 rounded-xl px-4 py-3">

                    <i class="fa-solid fa-magnifying-glass"></i>

                    <span>Análisis</span>

                </a>

                <!-- REPORTES -->
                <a th:href="@{/admin-reports}"
                    class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600">

                    <i class="fas fa-chart-column w-5"></i>

                    <span>Reportes</span>

                </a>

                <!-- SUSCRIPCIONES -->
                <a th:href="@{/admin-subscriptions}"
                    class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600">

                    <i class="fas fa-credit-card w-5"></i>

                    <span>Suscripciones</span>

                </a>

                <!-- SALIR ADMIN -->
                <div class="pt-4 mt-4 border-t border-slate-200">

                    <a th:href=@{/logout}
                        class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-red-500 hover:bg-red-50 hover:text-red-600">

                        <i class="fas fa-right-from-bracket w-5"></i>

                        <span>Salir del Admin</span>

                    </a>

                </div>

            </nav>

            <div class="mt-auto px-6 pb-8">

                <div class="border-t border-slate-200 pt-5">

                    <div class="flex items-center gap-3">

                        <div
                            class="h-11 w-11 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">
                            AD
                        </div>

                        <div>

                            <div class="font-semibold text-slate-900" th:text="${session.user.nombres}"></div>

                            <div class="text-sm text-slate-500">
                                Control total
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </aside>

        <div class="flex-1 min-w-0">
<header class="bg-white border-b border-slate-200">

        <div class="px-6 py-4 flex items-center justify-between">

          <div>

            <h1 class="text-2xl font-extrabold text-slate-900">
              Gestión de Análisis IA
            </h1>

            <p class="text-sm text-slate-500">
              Panel central de gestión OradorIA
            </p>

          </div>

          <div class="flex items-center gap-4">

            <!-- NOTIFICACIONES -->
            <button class="relative h-10 w-10 rounded-full hover:bg-slate-100 flex items-center justify-center">

              <i class="fas fa-bell text-slate-600"></i>

              <span class="absolute top-2 right-2 h-2 w-2 bg-red-500 rounded-full"></span>

            </button>

            <!-- AVATAR -->
            <div class="h-10 w-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">
              AD
            </div>

          </div>

        </div>

    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    
        <div class="card p-6">
            <h2 class="text-slate-500">Análisis Totales</h2>
    
            <p class="text-4xl font-extrabold mt-3"
               th:text="${totalAnalisis}"></p>
        </div>
    
        <div class="card p-6">
            <h2 class="text-slate-500">Promedio Fluidez</h2>
    
            <p class="text-4xl font-extrabold text-indigo-600 mt-3"
               th:text="${#numbers.formatDecimal(promedioFluidez,1,1)} + '%'">
    
            </p>
        </div>
    
        <div class="card p-6">
            <h2 class="text-slate-500">Promedio Postura</h2>
    
            <p class="text-4xl font-extrabold text-emerald-500 mt-3"
               th:text="${#numbers.formatDecimal(promedioPostura,1,1)} + '%'">
                
            </p>
        </div>
    
    </div>

        <div class="card p-6">

            <table class="w-full">

                <thead class="bg-slate-100">
                    <tr>
                        <th class="text-left p-4">ID</th>
                        <th class="text-left p-4">Título</th>
                        <th class="text-left p-4">Usuario</th>
                        <th class="text-left p-4">Duración</th>
                        <th class="text-left p-4">Estado</th>
                        <th class="text-left p-4">Fecha</th>
                    </tr>
                    </thead>

                    <tbody>
                        <tr th:each="a : ${analisis}" class="border-b">


                        
                            <td class="p-4" th:text="${a.titulo}"></td>
                        
                            <td class="p-4" th:text="${a.estado}"></td>
                        
                            <td class="p-4"
                                th:text="${#temporals.format(a.fecha, 'dd/MM/yyyy')}">
                            </td>
                        
                            <td class="p-4" th:text="${a.fluidez}"></td>
                        
                            <td class="p-4" th:text="${a.postura}"></td>
                        
                            <td class="p-4 flex gap-3">
                                <button class="text-blue-600">
                                    <i class="fas fa-eye"></i>
                                </button>
                        
                                <button class="text-red-600">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        
                        </tr>
                        
                        </tbody>

            </table>
            </div>
        </div>

</body>

</html>
