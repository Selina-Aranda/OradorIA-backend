<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Análisis | OradorIA Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

<style>
body{
background:#f8fafc;
font-family:Inter,sans-serif;
}
.card{
background:white;
border-radius:24px;
border:1px solid #e2e8f0;
}
</style>

</head>

<body class="p-8">

<h1 class="text-3xl font-extrabold text-slate-800 mb-6">
Gestión de Análisis IA
</h1>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">

<div class="card p-6">
<h2 class="text-slate-500">Análisis Totales</h2>
<p class="text-4xl font-extrabold mt-3">8,530</p>
</div>

<div class="card p-6">
<h2 class="text-slate-500">Promedio Fluidez</h2>
<p class="text-4xl font-extrabold text-indigo-600 mt-3">88%</p>
</div>

<div class="card p-6">
<h2 class="text-slate-500">Promedio Postura</h2>
<p class="text-4xl font-extrabold text-emerald-500 mt-3">91%</p>
</div>

</div>

<div class="card p-6">

<table class="w-full">

<thead class="bg-slate-100">

<tr>
<th class="text-left p-4">Usuario</th>
<th class="text-left p-4">Fluidez</th>
<th class="text-left p-4">Postura</th>
<th class="text-left p-4">Fecha</th>
<th class="text-left p-4">Acciones</th>
</tr>

</thead>

<tbody>

<tr class="border-b">

<td class="p-4">Roger</td>
<td class="p-4">90%</td>
<td class="p-4">87%</td>
<td class="p-4">17/05/2026</td>

<td class="p-4 flex gap-3">

<button class="text-blue-600">
<i class="fas fa-eye"></i>
</button>

<button class="text-red-600">
<i class="fas fa-trash"></i>
</button>

</td>

</tr>

</tbody>

</table>

</div>

</body>
</html>
