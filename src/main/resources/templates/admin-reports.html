<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<title>Reportes | OradorIA Admin</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body{
background:#f8fafc;
font-family:Inter,sans-serif;
}

.card{
background:white;
border-radius:24px;
border:1px solid #e2e8f0;
}
</style>

</head>

<body class="p-8">

<h1 class="text-3xl font-extrabold text-slate-800 mb-6">
Reportes del Sistema
</h1>

<div class="grid grid-cols-1 md:grid-cols-3 gap-6">

<div class="card p-6">

<h2 class="font-bold text-xl mb-4">
Reporte Usuarios
</h2>

<button class="bg-blue-600 text-white px-5 py-2 rounded-xl">
Descargar PDF
</button>

</div>

<div class="card p-6">

<h2 class="font-bold text-xl mb-4">
Reporte IA
</h2>

<button class="bg-indigo-600 text-white px-5 py-2 rounded-xl">
Descargar Excel
</button>

</div>

<div class="card p-6">

<h2 class="font-bold text-xl mb-4">
Reporte Financiero
</h2>

<button class="bg-emerald-600 text-white px-5 py-2 rounded-xl">
Generar Reporte
</button>

</div>

</div>

</body>
</html>
