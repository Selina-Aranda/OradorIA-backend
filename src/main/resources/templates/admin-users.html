<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Usuarios | OradorIA Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <style>
    * {
      font-family: 'Inter', sans-serif;
    }

    body {
      background: #f8fafc;
    }

    .card {
      background: white;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
    }

    .sidebar-link {
      transition: .2s;
    }

    .sidebar-link:hover {
      background: #f8fafc;
      color: #0f172a;
    }

    .sidebar-active {
      background: #eff6ff;
      color: #2563eb;
      font-weight: 600;
    }
  </style>
</head>

<body class="antialiased">

  <div class="min-h-screen flex">

    <!-- SIDEBAR -->
    <aside class="w-[280px] bg-white border-r border-slate-200 hidden md:flex flex-col">

      <!-- LOGO -->
      <div class="px-6 py-6">

        <div class="flex items-center gap-3">

          <span class="inline-flex h-11 w-11 items-center justify-center rounded-2xl bg-blue-600">
            <i class="fas fa-microphone-lines text-white"></i>
          </span>

          <span class="text-xl font-extrabold text-blue-600">
            OradorIA Admin
          </span>

        </div>

      </div>

      <!-- MENU -->
      <nav class="px-4 space-y-2">

        <!-- DASHBOARD -->
        <a th:href="@{/admin-dashboard}" class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3">

          <i class="fas fa-chart-pie w-5"></i>

          <span>Dashboard</span>

        </a>

        <!-- USUARIOS -->
        <a th:href="@{/admin-users}" class="sidebar-active flex items-center gap-3 rounded-xl px-4 py-3">

          <i class="fas fa-users w-5"></i>

          <span>Usuarios</span>

        </a>

        <!-- ANALISIS -->
        <a th:href="@{/admin-analysis}"
          class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600">

          <i class="fa-solid fa-magnifying-glass"></i>

          <span>Análisis</span>

        </a>

        <!-- REPORTES -->
        <a th:href="@{/admin-reports}" class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600">

          <i class="fas fa-chart-column w-5"></i>

          <span>Reportes</span>

        </a>

        <!-- SUSCRIPCIONES -->
        <a th:href="@{/admin-subscriptions}"
          class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600">

          <i class="fas fa-credit-card w-5"></i>

          <span>Suscripciones</span>

        </a>

        <!-- CONFIGURACION -->
        <a th:href="@{/admin-settings}"
          class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-slate-600">

          <i class="fas fa-gear w-5"></i>

          <span>Configuración</span>

        </a>

        <!-- SALIR ADMIN -->
        <div class="pt-4 mt-4 border-t border-slate-200">

          <a th:href=@{/logout}
            class="sidebar-link flex items-center gap-3 rounded-xl px-4 py-3 text-red-500 hover:bg-red-50 hover:text-red-600">

            <i class="fas fa-right-from-bracket w-5"></i>

            <span>Salir del Admin</span>

          </a>

        </div>

      </nav>

      <!-- ADMIN INFO -->
      <div class="mt-auto px-6 pb-8">

        <div class="border-t border-slate-200 pt-5">

          <div class="flex items-center gap-3">

            <div class="h-11 w-11 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">
              AD
            </div>

            <div>

              <div class="font-semibold text-slate-900" th:text="${session.user.nombres}"></div>

              <div class="text-sm text-slate-500">
                Control total
              </div>

            </div>

          </div>

        </div>

      </div>

    </aside>

<div class="flex-1 min-w-0">
    <header class="bg-white border-b border-slate-200">

        <div class="px-6 py-4 flex items-center justify-between">

          <div>

            <h1 class="text-2xl font-extrabold text-slate-900">
              Gestión de Usuarios
            </h1>

            <p class="text-sm text-slate-500">
              Panel central de gestión OradorIA
            </p>

          </div>

          <div class="flex items-center gap-4">

            <!-- NOTIFICACIONES -->
            <button class="relative h-10 w-10 rounded-full hover:bg-slate-100 flex items-center justify-center">

              <i class="fas fa-bell text-slate-600"></i>

              <span class="absolute top-2 right-2 h-2 w-2 bg-red-500 rounded-full"></span>

            </button>

            <!-- AVATAR -->
            <div class="h-10 w-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">
              AD
            </div>

          </div>

        </div>

      </header>

    <div class="card p-6">

      <div class="flex justify-between mb-6">

        <input type="text" placeholder="Buscar usuario..." class="border border-slate-300 rounded-xl px-4 py-2 w-80" />

        <button onClick="openCreateModal()"
                class="bg-blue-600 text-white px-5 py-2 rounded-xl">
          Nuevo Usuario
        </button>

      </div>

      <table class="w-full">

        <thead class="bg-slate-100">

          <tr>
            <th class="text-left p-4">Usuario</th>
            <th class="text-left p-4">Correo</th>
            <th class="text-left p-4">Rol</th>
            <th class="text-left p-4">Estado</th>
            <th class="text-left p-4">Acciones</th>
          </tr>

        </thead>

        <tbody>

          <tr th:each="u : ${usuarios}">
            <td th:text="${u.nombres}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.idRol == 1 ? 'ADMIN' : 'USUARIO'}"></td>
            <td th:text="${u.estado}"></td>

          <td class="p-4 flex gap-3">

              <button class="text-blue-600"
                      th:attr="data-id=${u.idUsuario},
                              data-nombres=${u.nombres},
                              data-apellidos=${u.apellidos},
                              data-email=${u.email},
                              data-rol=${u.idRol},
                              data-estado=${u.estado}"
                      onclick="openEditModal(this)">
                  <i class="fas fa-pen"></i>
              </button>

              <button class="text-red-600"
                      th:onclick="'deleteUser(' + ${u.idUsuario} + ')'">
                  <i class="fas fa-trash"></i>
              </button>

          </td>

          </tr>

        </tbody>

      </table>

    </div>
  </div>
  </div>
      <!-- MODAL -->

    <div id="userModal"
        class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

        <div class="bg-white rounded-2xl w-full max-w-lg p-6">

            <div class="flex justify-between items-center mb-6">

                <h2 id="modalTitle"
                    class="text-xl font-bold">
                    Nuevo Usuario
                </h2>

                <button onclick="closeModal()">
                    <i class="fas fa-times"></i>
                </button>

            </div>

            <form id="userForm">

                <input type="hidden"
                      id="idUsuario"
                      name="idUsuario">

                <div class="space-y-4">

                    <input
                            id="nombres"
                            name="nombres"
                            placeholder="Nombres"
                            class="w-full border rounded-xl px-4 py-3">

                    <input
                            id="apellidos"
                            name="apellidos"
                            placeholder="Apellidos"
                            class="w-full border rounded-xl px-4 py-3">

                    <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="Correo"
                            class="w-full border rounded-xl px-4 py-3">

                    <input
                            id="password"
                            name="password"
                            type="password"
                            placeholder="Contraseña"
                            class="w-full border rounded-xl px-4 py-3">

                    <select
                            id="idRol"
                            name="idRol"
                            class="w-full border rounded-xl px-4 py-3">

                        <option value="1">Administrador</option>
                        <option value="2">Usuario</option>

                    </select>

                    <select
                            id="estado"
                            name="estado"
                            class="w-full border rounded-xl px-4 py-3">

                        <option value="ACTIVE">ACTIVE</option>
                        <option value="INACTIVE">INACTIVE</option>
                        <option value="SUSPENDED">SUSPENDED</option>
   

                    </select>

                </div>

                <div class="flex justify-end gap-3 mt-6">

                    <button type="button"
                            onclick="closeModal()"
                            class="px-5 py-2 border rounded-xl">
                        Cancelar
                    </button>

                    <button type="submit"
                            class="px-5 py-2 bg-blue-600 text-white rounded-xl">
                        Guardar
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script>
        document.getElementById("userForm").addEventListener("submit", async function(e){

            e.preventDefault();

            if(editMode){
                await actualizarUsuario();
            }else{
                await guardarUsuario();
            }
        });
    </script>

    <script>

        let editMode = false;

          function openCreateModal() {

              editMode = false;

              document.getElementById("modalTitle").innerText = "Nuevo Usuario";

              document.getElementById("idUsuario").value = "";
              document.getElementById("nombres").value = "";
              document.getElementById("apellidos").value = "";
              document.getElementById("email").value = "";
              document.getElementById("password").value = "";
              document.getElementById("idRol").value = "2";
              document.getElementById("estado").value = "INACTIVE";

              document.getElementById("userModal").classList.remove("hidden");
              document.getElementById("userModal").classList.add("flex");
          }

          function openEditModal(btn) {

              editMode = true;

              document.getElementById("modalTitle").innerText = "Editar Usuario";

              document.getElementById("idUsuario").value = btn.dataset.id;
              document.getElementById("nombres").value = btn.dataset.nombres;
              document.getElementById("apellidos").value = btn.dataset.apellidos;
              document.getElementById("email").value = btn.dataset.email;
              document.getElementById("idRol").value = btn.dataset.rol;
              document.getElementById("estado").value = btn.dataset.estado;

              document.getElementById("password").value = "";

              document.getElementById("userModal").classList.remove("hidden");
              document.getElementById("userModal").classList.add("flex");
          }

          function closeModal() {

              document.getElementById("userModal").classList.remove("flex");
              document.getElementById("userModal").classList.add("hidden");
          }

        async function guardarUsuario() {

            const usuario = {
                nombres: document.getElementById("nombres").value,
                apellidos: document.getElementById("apellidos").value,
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
                idRol: parseInt(document.getElementById("idRol").value),
                estado: document.getElementById("estado").value
            };

            const response = await fetch('/users', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(usuario)
            });

            if(response.ok){
                closeModal()
                location.reload();
            }
        }

        async function deleteUser(id){

            if(!confirm("¿Eliminar usuario?")){
                return;
            }

            const response = await fetch('/users/' + id,{
                method:'DELETE'
            });

            if(response.ok){
                location.reload();
            }
        }

        async function actualizarUsuario(){

              const id = document.getElementById("idUsuario").value;

              const password = document.getElementById("password").value;

              const usuario = {
                  idUsuario: id,
                  nombres: document.getElementById("nombres").value,
                  apellidos: document.getElementById("apellidos").value,
                  email: document.getElementById("email").value,
                  idRol: parseInt(document.getElementById("idRol").value),
                  estado: document.getElementById("estado").value
              };

              if (password.trim() !== "") {
                  usuario.password = password;
              }

              const response = await fetch('/users/' + id,{
                  method:'PUT',
                  headers:{
                      'Content-Type':'application/json'
                  },
                  body: JSON.stringify(usuario)
              });

              if(response.ok){
                  closeModal()
                  location.reload();
              }
          }

      </script>
</body>

</html>
