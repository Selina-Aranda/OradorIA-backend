<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuarios | OradorIA Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
  rel="stylesheet"/>

  <style>
    *{
      font-family:'Inter',sans-serif;
    }

    body{
      background:#f8fafc;
    }

    .card{
      background:white;
      border-radius:24px;
      border:1px solid #e2e8f0;
    }
  </style>
</head>

<body class="p-8">

<h1 class="text-3xl font-extrabold text-slate-800 mb-6">
  Gestión de Usuarios
</h1>

<div class="card p-6">

  <div class="flex justify-between mb-6">

    <input type="text"
    placeholder="Buscar usuario..."
    class="border border-slate-300 rounded-xl px-4 py-2 w-80"/>

    <button class="bg-blue-600 text-white px-5 py-2 rounded-xl">
      Nuevo Usuario
    </button>

  </div>

  <table class="w-full">

    <thead class="bg-slate-100">

      <tr>
        <th class="text-left p-4">Usuario</th>
        <th class="text-left p-4">Correo</th>
        <th class="text-left p-4">Rol</th>
        <th class="text-left p-4">Estado</th>
        <th class="text-left p-4">Acciones</th>
      </tr>

    </thead>

    <tbody>

      <tr class="border-b">
        <td class="p-4">Roger</td>
        <td class="p-4">roger@gmail.com</td>
        <td class="p-4">Premium</td>
        <td class="p-4 text-green-600">Activo</td>

        <td class="p-4 flex gap-3">

          <button class="text-blue-600">
            <i class="fas fa-pen"></i>
          </button>

          <button class="text-red-600">
            <i class="fas fa-trash"></i>
          </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>

</body>
</html>
